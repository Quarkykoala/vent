name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan check
        run: |
          # Ensure no private keys or committed secrets exist in working tree.
          # .github is excluded because this file necessarily contains the
          # patterns being searched for, which otherwise fails the scan.
          ! grep -r "BEGIN RSA PRIVATE KEY" . --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.github
          ! grep -r "BEGIN PRIVATE KEY" . --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.github
          ! grep -r "rzp_live_" . --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.github

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit & Invariant Tests
        run: pnpm test

      - name: Build
        run: pnpm build
